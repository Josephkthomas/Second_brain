<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b101b"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="3"/>

  <!-- Neural network nodes -->
  <circle cx="38" cy="44" r="10" fill="url(#nodeGrad)"/>
  <circle cx="90" cy="44" r="10" fill="url(#nodeGrad)"/>
  <circle cx="64" cy="88" r="10" fill="url(#nodeGrad)"/>
  <circle cx="42" cy="76" r="7" fill="#0891b2"/>
  <circle cx="86" cy="76" r="7" fill="#0891b2"/>
  <circle cx="64" cy="52" r="7" fill="#0891b2"/>

  <!-- Connections -->
  <line x1="38" y1="44" x2="64" y2="88" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>
  <line x1="90" y1="44" x2="64" y2="88" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>
  <line x1="38" y1="44" x2="90" y2="44" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>
  <line x1="38" y1="44" x2="42" y2="76" stroke="#0891b2" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="44" x2="86" y2="76" stroke="#0891b2" stroke-width="2" opacity="0.6"/>
  <line x1="42" y1="76" x2="64" y2="88" stroke="#0891b2" stroke-width="2" opacity="0.6"/>
  <line x1="86" y1="76" x2="64" y2="88" stroke="#0891b2" stroke-width="2" opacity="0.6"/>
  <line x1="38" y1="44" x2="64" y2="52" stroke="#0891b2" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="44" x2="64" y2="52" stroke="#0891b2" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="52" x2="64" y2="88" stroke="#0891b2" stroke-width="2" opacity="0.6"/>
</svg>
